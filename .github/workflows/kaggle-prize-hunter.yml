name: Kaggle Prize Hunter

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'prize-hunter/control.json'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout Animation Factory
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Kaggle CLI
        run: pip install -r requirements.txt

      - name: Stage 1 - scan and rank active competitions
        run: python prize_hunter.py

      - name: Stage 2 - build top competition dossiers
        run: python prize_dossier.py --top 5

      - name: Commit Prize Hunter reports and dossiers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prize-hunter/latest.md prize-hunter/latest.json prize-hunter/feed.json prize-hunter/history/ prize-hunter/dossiers/
          if git diff --cached --quiet; then
            echo "No Prize Hunter changes to commit."
          else
            git commit -m "Prize Hunter daily scan and dossiers"
            git push
          fi
