name: Autonomous Episode 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/autonomous-episode-001.yml
      - automation/validate_canon_refs.py
      - automation/episode001_orchestrator_v2.py
      - automation/episode001_orchestrator_v3.py
      - automation/render_episode001.py
      - kernels/earth-needs-help-e001-stills/main.py
      - kernels/episode-motion-runner/main.py
      - shows/earth-needs-help/character-bible.md
      - shows/earth-needs-help/continuity-manifest.json
      - shows/earth-needs-help/assets/characters/**
      - shows/earth-needs-help/episodes/001-great-earth-emergency/continuity-qa.json
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-earth-needs-help-e001
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}

    steps:
      - name: Checkout factory
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install controller dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -r requirements.txt
          pip install Pillow "edge-tts>=7,<8" "numpy>=2,<3"

      - name: Validate locked visual canon
        id: canon
        continue-on-error: true
        run: python automation/validate_canon_refs.py

      - name: Run self-healing episode controller
        id: controller
        if: steps.canon.outcome == 'success'
        continue-on-error: true
        run: python automation/episode001_orchestrator_v3.py

      - name: Read episode state
        id: state
        if: always()
        shell: bash
        run: |
          if [ -f automation/episode001-state.json ]; then
            phase="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('automation/episode001-state.json')
          try:
              print(json.loads(p.read_text()).get('phase', 'unknown'))
          except Exception:
              print('unknown')
          PY
          )"
          else
            phase="unknown"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Episode phase: $phase"

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-001-production-state
          path: |
            automation/episode001-state.json
            automation/logs/
            shows/earth-needs-help/continuity-manifest.json
            shows/earth-needs-help/episodes/001-great-earth-emergency/continuity-qa.json
            shows/earth-needs-help/episodes/001-great-earth-emergency/assets/stills/
            dist/earth-needs-help-e001-final-qa.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload final episode artifact
        if: steps.state.outputs.phase == 'complete' && hashFiles('dist/earth-needs-help-e001-final.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: earth-needs-help-episode-001
          path: |
            dist/earth-needs-help-e001-final.mp4
            dist/earth-needs-help-e001-final-qa.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish final MP4 to GitHub Release
        if: steps.state.outputs.phase == 'complete' && hashFiles('dist/earth-needs-help-e001-final.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="earth-needs-help-e001"
          title="Earth Needs Help — Episode 001: The Great Earth Emergency"
          video="dist/earth-needs-help-e001-final.mp4"
          qa="dist/earth-needs-help-e001-final-qa.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$video" "$qa" --clobber
          else
            gh release create "$tag" "$video" "$qa" \
              --title "$title" \
              --notes "Animation Factory autonomous final export. Includes voices, original generated music/SFX, and technical QA report."
          fi
          python - <<'PY'
          import json
          import time
          from pathlib import Path
          p = Path('automation/episode001-state.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          state['release_published'] = True
          state['release_published_at'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
          state['last_status'] = 'FINAL_RELEASE_PUBLISHED'
          p.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Persist controller state, continuity review and canonical stills
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "animation-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          snapshot="$(mktemp -d)"
          mkdir -p "$snapshot/automation"
          if [ -f automation/episode001-state.json ]; then
            cp -f automation/episode001-state.json "$snapshot/automation/episode001-state.json"
          fi
          if [ -d automation/logs ]; then
            mkdir -p "$snapshot/automation/logs"
            cp -a automation/logs/. "$snapshot/automation/logs/"
          fi
          snapshot_episode="$snapshot/shows/earth-needs-help/episodes/001-great-earth-emergency"
          mkdir -p "$snapshot_episode"
          if [ -f shows/earth-needs-help/episodes/001-great-earth-emergency/continuity-qa.json ]; then
            cp -f shows/earth-needs-help/episodes/001-great-earth-emergency/continuity-qa.json "$snapshot_episode/continuity-qa.json"
          fi
          snapshot_stills="$snapshot_episode/assets/stills"
          if [ -d shows/earth-needs-help/episodes/001-great-earth-emergency/assets/stills ]; then
            mkdir -p "$snapshot_stills"
            cp -a shows/earth-needs-help/episodes/001-great-earth-emergency/assets/stills/. "$snapshot_stills/"
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            if [ -f "$snapshot/automation/episode001-state.json" ]; then
              mkdir -p automation
              cp -f "$snapshot/automation/episode001-state.json" automation/episode001-state.json
            fi
            if [ -d "$snapshot/automation/logs" ]; then
              mkdir -p automation/logs
              cp -a "$snapshot/automation/logs/." automation/logs/
            fi
            episode_dir="shows/earth-needs-help/episodes/001-great-earth-emergency"
            if [ -f "$snapshot_episode/continuity-qa.json" ]; then
              mkdir -p "$episode_dir"
              cp -f "$snapshot_episode/continuity-qa.json" "$episode_dir/continuity-qa.json"
            fi
            if [ -d "$snapshot_stills" ]; then
              mkdir -p "$episode_dir/assets/stills"
              cp -a "$snapshot_stills/." "$episode_dir/assets/stills/"
            fi

            git add automation/episode001-state.json automation/logs/ \
              "$episode_dir/continuity-qa.json" "$episode_dir/assets/stills/" 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No production-state changes to persist."
              break
            fi
            git commit -m "Update autonomous Episode 001 production state [skip ci]"
            if git push origin HEAD:main; then
              break
            fi
            echo "State push raced with another commit; retrying on latest main ($attempt/3)."
          done

      - name: Self-requeue while production is active
        if: steps.state.outputs.phase != 'complete' && steps.state.outputs.phase != 'failed' && steps.state.outputs.phase != 'blocked_continuity' && steps.state.outputs.phase != 'awaiting_continuity_review'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Production still active; scheduling the next controller cycle."
          sleep 480
          gh workflow run autonomous-episode-001.yml --ref main

      - name: Continuity block notice
        if: steps.state.outputs.phase == 'blocked_continuity'
        run: echo "Production is intentionally paused because the locked visual canon failed preflight or is not ready."

      - name: Continuity review notice
        if: steps.state.outputs.phase == 'awaiting_continuity_review'
        run: echo "Production is intentionally paused until the exact still batch passes visual character-continuity review."

      - name: Stop only on terminal failure
        if: steps.state.outputs.phase == 'failed'
        run: exit 1
