name: Kaggle Worker

on:
  push:
    branches: [main]
    paths:
      - control/command.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_OWNER: ${{ vars.KAGGLE_OWNER }}

    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Kaggle CLI
        run: pip install -r requirements.txt

      - name: Execute Kaggle command
        id: worker
        continue-on-error: true
        run: python worker_v2.py

      - name: Upload Kaggle output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-output
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish latest result
        if: always()
        run: |
          mkdir -p results
          if [ -f result.md ]; then
            cp result.md results/latest.md
          else
            printf '## ❌ Kaggle Worker\n\nThe worker stopped before producing a result file.\n' > results/latest.md
          fi
          cp results/latest.md /tmp/animation-factory-latest.md
          git config user.name "animation-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/animation-factory-latest.md results/latest.md
          git add results/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Kaggle worker result [skip ci]"
            git push origin HEAD:main
          fi

      - name: Fail workflow when worker failed
        if: steps.worker.outcome == 'failure'
        run: exit 1
