name: Validate Animation Factory skills

on:
  push:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/**'
      - 'pipeline/**'
      - 'kernels/reference-still-runner/**'
      - 'shows/**/show-bible.md'
      - 'shows/**/character-bible.md'
      - 'shows/**/style-bible.md'
      - 'shows/**/episodes/**/production.json'
      - 'shows/**/episodes/**/episode*-image-job.json'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/**'
      - 'pipeline/**'
      - 'kernels/reference-still-runner/**'
      - 'shows/**/show-bible.md'
      - 'shows/**/character-bible.md'
      - 'shows/**/style-bible.md'
      - 'shows/**/episodes/**/production.json'
      - 'shows/**/episodes/**/episode*-image-job.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production skills and canon
        run: python pipeline/validate_skills.py
      - name: Validate hybrid image Python entrypoints
        run: >-
          python -m py_compile
          pipeline/image_router.py
          kernels/reference-still-runner/main.py
          kernels/reference-still-runner/bootstrap.py
      - name: Validate image generation JSON
        run: >-
          python -c "import json; from pathlib import Path; [json.loads(Path(p).read_text()) for p in ['pipeline/image-generation.json','shows/earth-needs-help/episodes/001-great-earth-emergency/episode001-image-job.json']]"
      - name: Smoke-test context loader
        run: >-
          python pipeline/skill_loader.py
          --show earth-needs-help
          --episode 001-great-earth-emergency
          --stage video-prompt-engineer
          > /tmp/animation-factory-context.json
