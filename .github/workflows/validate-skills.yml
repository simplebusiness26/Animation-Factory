name: Validate Animation Factory skills

on:
  push:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/**'
      - 'pipeline/**'
      - 'automation/**.py'
      - 'worker*.py'
      - 'kernels/episode-motion-runner/**'
      - 'kernels/reference-still-runner/**'
      - 'kernels/flux2-smoke-test/**'
      - 'tests/**'
      - '.github/workflows/validate-skills.yml'
      - '.github/workflows/kaggle-worker.yml'
      - '.github/workflows/flux2-smoke-test.yml'
      - 'control/flux2-smoke-request.json'
      - 'shows/**/continuity-manifest.json'
      - 'shows/**/assets/characters/**'
      - 'shows/**/show-bible.md'
      - 'shows/**/character-bible.md'
      - 'shows/**/style-bible.md'
      - 'shows/**/episodes/**/production.json'
      - 'shows/**/episodes/**/episode*-image-job.json'
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/**'
      - 'pipeline/**'
      - 'automation/**.py'
      - 'worker*.py'
      - 'kernels/episode-motion-runner/**'
      - 'kernels/reference-still-runner/**'
      - 'kernels/flux2-smoke-test/**'
      - 'tests/**'
      - '.github/workflows/validate-skills.yml'
      - '.github/workflows/kaggle-worker.yml'
      - '.github/workflows/flux2-smoke-test.yml'
      - 'control/flux2-smoke-request.json'
      - 'shows/**/continuity-manifest.json'
      - 'shows/**/assets/characters/**'
      - 'shows/**/show-bible.md'
      - 'shows/**/character-bible.md'
      - 'shows/**/style-bible.md'
      - 'shows/**/episodes/**/production.json'
      - 'shows/**/episodes/**/episode*-image-job.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight validation dependencies
        run: pip install Pillow==12.1.0 numpy==2.2.6
      - name: Exercise routing, launch guards, controller and output contracts
        run: python -m unittest discover -s tests -v
      - name: Check all Python entrypoints
        run: python -m compileall -q pipeline automation kernels worker.py worker_v2.py
      - name: Verify locked reference image bytes
        run: python automation/validate_canon_refs.py
      - name: Validate production skills and canon
        run: python pipeline/validate_skills.py
      - name: Validate hybrid image and smoke Python entrypoints
        run: >-
          python -m py_compile
          pipeline/image_router.py
          kernels/reference-still-runner/main.py
          kernels/reference-still-runner/bootstrap.py
          kernels/flux2-smoke-test/main.py
      - name: Validate image and smoke JSON contracts
        run: >-
          python -c "import json; from pathlib import Path; files=['pipeline/image-generation.json','shows/earth-needs-help/episodes/001-great-earth-emergency/episode001-image-job.json','kernels/flux2-smoke-test/kernel-metadata.json','control/flux2-smoke-request.json']; data=[json.loads(Path(p).read_text()) for p in files]; req=data[-1]; assert req['action']=='flux2_single_shot_smoke' and req['shot']=='002' and req['production_episode_remains_paused'] is True"
      - name: Smoke-test context loader
        run: >-
          python pipeline/skill_loader.py
          --show earth-needs-help
          --episode 001-great-earth-emergency
          --stage video-prompt-engineer
          > /tmp/animation-factory-context.json
